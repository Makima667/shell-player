[package]
name = "shell-player"
version = "0.1.0"
description = "空壳播放器：可配置音源的音乐播放器"
authors = ["Makima667"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shell_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-media-session = { path = "../plugins/tauri-plugin-media-session" }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
