<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>桌面歌词</title>
  <style>
    :root { --h: 228; --size: 34px; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
    .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 16px; transition: background .3s; cursor: move; padding: 0 16px; }
    body:not(.locked) .wrap:hover { background: rgb(10 12 20 / .45); }
    .line { font-size: var(--size); font-weight: 700; line-height: 1.25; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
      color: transparent; -webkit-background-clip: text; background-clip: text;
      background-image: linear-gradient(90deg, hsl(var(--h) 95% 72%) var(--p, 0%), #fff calc(var(--p, 0%) + .5%));
      filter: drop-shadow(0 2px 2px rgb(0 0 0 / .75)) drop-shadow(0 0 1px rgb(0 0 0 / .9)); transition: opacity .25s; }
    .line.swap { animation: swap .45s cubic-bezier(.22, 1, .36, 1); }
    @keyframes swap { from { opacity: 0; transform: translateY(14px); } }
    .sub { font-size: calc(var(--size) * .5); color: rgb(255 255 255 / .9); filter: drop-shadow(0 1px 2px rgb(0 0 0 / .8)); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .bar { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; opacity: 0; transition: opacity .2s; }
    body:not(.locked) .wrap:hover .bar { opacity: 1; }
    .bar button { border: 0; width: 28px; height: 28px; border-radius: 50%; background: rgb(255 255 255 / .15); color: #fff; cursor: pointer; display: grid; place-items: center; }
    .bar button:hover { background: rgb(255 255 255 / .3); }
    .bar svg { width: 16px; height: 16px; fill: currentColor; }
  </style>
</head>
<body>
  <div class="wrap" data-tauri-drag-region>
    <div class="bar">
      <button data-c="prev" title="上一首"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3.5 7L19 5v14z"/></svg></button>
      <button data-c="toggle" title="播放/暂停"><svg viewBox="0 0 24 24"><path id="pp" d="M8 5.5v13l11-6.5z"/></svg></button>
      <button data-c="next" title="下一首"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l9.5 7L5 19z"/></svg></button>
      <button data-c="lock" title="锁定（鼠标穿透）"><svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h2v12H5V10zm2 0h6V7a3 3 0 0 0-6 0z"/></svg></button>
      <button data-c="close" title="关闭桌面歌词"><svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></svg></button>
    </div>
    <div class="line" id="line" data-tauri-drag-region>空壳播放器</div>
    <div class="sub" id="sub" data-tauri-drag-region></div>
  </div>
  <script type="module" src="/src/lyrics.js"></script>
</body>
</html>
