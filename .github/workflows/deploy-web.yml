name: 部署网页版到 Cloudflare Pages

# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   CLOUDFLARE_API_TOKEN（权限：Cloudflare Pages 编辑）
#   CLOUDFLARE_ACCOUNT_ID
# 先手动运行验证；确认没问题后可以把下面的 push 触发打开，合并到 main 自动部署
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 创建 Pages 项目（已存在会跳过）
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create shell-player --production-branch main
      - name: 部署
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name shell-player --branch main
